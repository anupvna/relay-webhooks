services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-key}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
